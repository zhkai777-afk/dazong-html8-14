<!doctype html>
<html lang="zh-CN" data-platform="windows">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>容量计重离线系统</title>
  <style>
    :root {
      font-family: Inter, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif;
      color: #172033;
      background: #eef2f6;
      --app-min-width: 1024px;
      --app-min-height: 640px;
      --titlebar-height: 52px;
      --contextbar-height: 44px;
      --shell: #15243a;
      --shell-hover: #203552;
      --shell-active: #263e5e;
      --primary: #2563a7;
      --primary-strong: #194f8a;
      --surface: #ffffff;
      --canvas: #eef2f6;
      --border: #d8e0e9;
      --muted: #66758a;
      --focus: #62a9f4;
      --shadow: 0 2px 10px rgba(14, 31, 52, .12);
    }
    * { box-sizing: border-box; }
    html, body { min-width: var(--app-min-width); min-height: var(--app-min-height); }
    body { margin: 0; overflow: auto; font-size: 14px; line-height: 1.45; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    button, [href] { cursor: pointer; }
    [hidden] { display: none !important; }
    .skip-link { position: fixed; z-index: 1000; top: 8px; left: 50%; padding: 8px 14px; border-radius: 4px; color: #fff; background: #0b5aa5; transform: translate(-50%, -150%); }
    .skip-link:focus { transform: translate(-50%, 0); }
    .app { display: grid; min-width: var(--app-min-width); min-height: max(100dvh, var(--app-min-height)); grid-template-rows: var(--titlebar-height) var(--contextbar-height) minmax(0, 1fr); background: var(--canvas); }
    .titlebar { position: relative; z-index: 30; display: grid; grid-template-columns: minmax(210px, auto) minmax(430px, 1fr) minmax(236px, auto); align-items: stretch; color: #dce6f3; background: var(--shell); box-shadow: var(--shadow); user-select: none; -webkit-app-region: drag; }
    .titlebar > * { min-width: 0; }
    .titlebar button, .titlebar a { -webkit-app-region: no-drag; }
    .brand-area { min-width: 0; }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; height: 100%; padding: 0 14px; color: #fff; }
    .brand-mark { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border: 1px solid rgba(255,255,255,.42); border-radius: 6px; background: rgba(255,255,255,.07); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .brand-copy { min-width: 0; }
    .brand strong { display: block; overflow: hidden; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .brand small { display: block; overflow: hidden; margin-top: 1px; color: #9fb0c6; font-size: 10px; letter-spacing: .02em; text-overflow: ellipsis; white-space: nowrap; }
    .primary-nav { display: flex; align-items: stretch; justify-content: center; min-width: 0; }
    .nav-item { position: relative; display: flex; min-width: 112px; align-items: center; justify-content: center; gap: 7px; padding: 0 16px; color: #c7d2e0; text-decoration: none; transition: color 160ms ease, background-color 160ms ease; }
    .nav-item::after { position: absolute; right: 16px; bottom: 0; left: 16px; height: 3px; border-radius: 3px 3px 0 0; background: transparent; content: ""; }
    .nav-item:hover { color: #fff; background: var(--shell-hover); }
    .nav-item.active { color: #fff; background: var(--shell-active); }
    .nav-item.active::after { background: #69b4ff; }
    .nav-item strong { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .account-area { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 12px; }
    .offline { display: inline-flex; align-items: center; gap: 7px; color: #c6d5e7; font-size: 12px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #31c995; box-shadow: 0 0 0 3px rgba(49,201,149,.13); }
    .user { display: inline-flex; min-height: 36px; align-items: center; gap: 8px; padding: 0 8px; border: 0; border-radius: 5px; color: #eef5fd; background: transparent; }
    .user:hover { background: var(--shell-hover); }
    .avatar { display: grid; width: 26px; height: 26px; place-items: center; border: 1px solid #6f829a; border-radius: 50%; background: #254264; font-size: 12px; }
    .window-controls { display: flex; align-items: center; align-self: stretch; -webkit-app-region: no-drag; }
    .window-control { position: relative; display: grid; border: 0; color: inherit; background: transparent; place-items: center; }
    .window-control:focus-visible, .nav-item:focus-visible, .user:focus-visible, .platform-choice:focus-visible, .icon-button:focus-visible, .closed-state button:focus-visible { z-index: 2; outline: 2px solid var(--focus); outline-offset: -2px; }
    .window-controls--windows { justify-content: flex-end; }
    .window-controls--windows .window-control { width: 46px; height: 100%; }
    .window-controls--windows .window-control:hover { background: rgba(255,255,255,.12); }
    .window-controls--windows .window-control.close:hover { color: #fff; background: #c42b1c; }
    .window-controls--windows svg { width: 12px; height: 12px; }
    .window-controls--mac { display: none; width: 76px; height: 100%; flex: 0 0 76px; justify-content: center; gap: 0; padding: 0; }
    .window-controls--mac .window-control { width: 20px; height: 36px; flex: 0 0 20px; padding: 0; border: 0; border-radius: 0; background: transparent; line-height: 0; }
    .window-controls--mac .window-control::before { position: absolute; width: 13px; height: 13px; border: 1px solid rgba(0,0,0,.18); border-radius: 50%; content: ""; }
    .window-controls--mac .close::before { background: #ff5f57; }
    .window-controls--mac .minimize::before { background: #febc2e; }
    .window-controls--mac .maximize::before { background: #28c840; }
    .window-controls--mac svg { z-index: 1; width: 8px; height: 8px; opacity: 0; }
    .window-controls--mac:hover svg, .window-controls--mac:focus-within svg { opacity: .72; }
    html[data-platform="macos"] .titlebar { grid-template-columns: minmax(230px, auto) minmax(430px, 1fr) minmax(190px, auto); }
    html[data-platform="macos"] .window-controls--mac { display: flex; }
    html[data-platform="macos"] .window-controls--windows { display: none; }
    html[data-platform="macos"] .brand-area { display: flex; align-items: center; }
    html[data-platform="windows"] .brand-area { display: contents; }
    html[data-platform="windows"] .window-controls--mac { display: none; }
    .contextbar { z-index: 10; display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 16px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .page-identity { display: flex; min-width: 0; align-items: baseline; gap: 10px; }
    .page-identity h1 { overflow: hidden; margin: 0; color: #172033; font-size: 16px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .crumbs { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .crumbs::before { margin-right: 7px; color: #a1adba; content: "/"; }
    .context-actions { display: flex; align-items: center; gap: 6px; }
    .platform-switch { display: inline-flex; height: 30px; align-items: center; gap: 2px; padding: 2px; border: 1px solid #d3dce7; border-radius: 6px; background: #eef2f6; white-space: nowrap; }
    .platform-switch-label { padding: 0 5px 0 6px; color: #6a7889; font-size: 11px; }
    .platform-choice { height: 24px; padding: 0 9px; border: 0; border-radius: 4px; color: #526276; background: transparent; font-size: 11px; font-weight: 500; transition: color 160ms ease, background-color 160ms ease, box-shadow 160ms ease; }
    .platform-choice:hover { color: #1d4f82; background: rgba(255,255,255,.7); }
    .platform-choice[aria-pressed="true"] { color: #143f6c; background: #fff; box-shadow: 0 1px 3px rgba(18,39,64,.16); }
    .icon-button { display: grid; width: 32px; height: 32px; border: 1px solid transparent; border-radius: 5px; color: #536478; background: transparent; place-items: center; }
    .icon-button:hover { border-color: #d8e0e9; color: #1b4f84; background: #f3f6f9; }
    .workspace { min-width: 0; min-height: 0; padding: 8px; }
    .page-card { position: relative; overflow: hidden; width: 100%; height: 100%; min-height: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); box-shadow: 0 1px 3px rgba(17, 34, 55, .05); }
    iframe { display: block; width: 100%; height: 100%; min-height: calc(var(--app-min-height) - var(--titlebar-height) - var(--contextbar-height) - 18px); border: 0; background: var(--canvas); }
    .frame-loading { position: absolute; z-index: 20; inset: 0; display: grid; color: #56677a; background: rgba(246,248,251,.92); place-items: center; }
    .loading-content { display: flex; align-items: center; gap: 10px; }
    .loading-spinner { width: 18px; height: 18px; border: 2px solid #c8d6e5; border-top-color: var(--primary); border-radius: 50%; animation: spin 700ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .closed-state { display: none; height: 100%; min-height: 480px; place-items: center; color: #6d7a8a; text-align: center; }
    .closed-state.show { display: grid; }
    .closed-state button { min-height: 36px; margin-top: 12px; padding: 0 16px; border: 1px solid var(--primary-strong); border-radius: 5px; color: #fff; background: var(--primary); }
    .closed-state button:hover { background: var(--primary-strong); }
    .toast { position: fixed; z-index: 100; right: 16px; bottom: 16px; max-width: 320px; padding: 9px 12px; border: 1px solid #c8d6e5; border-radius: 6px; color: #eaf2fb; background: #213651; box-shadow: 0 6px 18px rgba(15,31,50,.2); opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 160ms ease, transform 160ms ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1180px) {
      .titlebar { grid-template-columns: minmax(168px, auto) minmax(392px, 1fr) minmax(218px, auto); }
      html[data-platform="macos"] .titlebar { grid-template-columns: minmax(200px, auto) minmax(392px, 1fr) minmax(150px, auto); }
      .brand small, .user .user-name { display: none; }
      .nav-item { min-width: 104px; padding: 0 12px; }
      .nav-item::after { right: 12px; left: 12px; }
      .account-area { gap: 8px; padding-right: 8px; }
    }
    @media (max-height: 720px) {
      :root { --titlebar-height: 48px; --contextbar-height: 40px; }
      .workspace { padding: 6px; }
      .brand-mark { width: 28px; height: 28px; }
      .contextbar { padding-left: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .loading-spinner { animation: none; border-top-color: #c8d6e5; background: var(--primary); box-shadow: inset 0 0 0 5px #f6f8fb; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到页面内容</a>
  <div class="app">
    <header class="titlebar" aria-label="应用标题栏">
      <div class="brand-area">
        <div class="window-controls window-controls--mac" aria-label="macOS 窗口控制">
          <button class="window-control close" type="button" data-window-action="close" aria-label="关闭窗口"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8" fill="none" stroke="#521514" stroke-width="1.4"/></svg></button>
          <button class="window-control minimize" type="button" data-window-action="minimize" aria-label="最小化窗口"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6" fill="none" stroke="#5c3b05" stroke-width="1.4"/></svg></button>
          <button class="window-control maximize" type="button" data-window-action="maximize" aria-label="最大化窗口"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.2 2.2h5.6v5.6H2.2z" fill="none" stroke="#0b4819" stroke-width="1.2"/></svg></button>
        </div>
        <div class="brand" aria-label="容量计重离线系统"><span class="brand-mark" aria-hidden="true">CQ</span><span class="brand-copy"><strong>容量计重离线系统</strong><small>Quantity Survey · Offline</small></span></div>
      </div>
      <nav class="primary-nav" aria-label="系统主导航">
        <a class="nav-item active" href="#" aria-current="page" data-page="检验任务管理.html" data-title="检验任务管理" data-crumb="检验任务"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 5h10M9 12h10M9 19h10M4 5h.01M4 12h.01M4 19h.01"/></svg><strong>检验任务</strong></a>
        <a class="nav-item" href="#" data-page="基础数据管理.html" data-title="基础数据管理" data-crumb="基础数据"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg><strong>基础数据</strong></a>
        <a class="nav-item" href="#" data-page="版本管理.html" data-title="版本管理" data-crumb="版本管理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3a9 9 0 1 1-8.5 6"/><path d="M3 3v6h6M12 7v5l3 2"/></svg><strong>版本管理</strong></a>
      </nav>
      <div class="account-area">
        <div class="offline" title="当前应用不依赖网络连接"><span class="status-dot" aria-hidden="true"></span><span>离线可用</span></div>
        <button class="user" type="button" aria-label="打开管理员账户菜单"><span class="avatar" aria-hidden="true">管</span><span class="user-name">管理员</span></button>
        <div class="window-controls window-controls--windows" aria-label="Windows 窗口控制">
          <button class="window-control minimize" type="button" data-window-action="minimize" aria-label="最小化窗口"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5h8" fill="none" stroke="currentColor"/></svg></button>
          <button class="window-control maximize" type="button" data-window-action="maximize" aria-label="最大化窗口"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor"/></svg></button>
          <button class="window-control close" type="button" data-window-action="close" aria-label="关闭窗口"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="currentColor"/></svg></button>
        </div>
      </div>
    </header>
    <div class="contextbar">
      <div class="page-identity"><h1 id="pageTitle">检验任务管理</h1><div class="crumbs" id="crumbPath">检验任务</div></div>
      <div class="context-actions">
        <div class="platform-switch" role="group" aria-label="演示布局切换">
          <span class="platform-switch-label" aria-hidden="true">布局</span>
          <button class="platform-choice" type="button" data-platform-choice="macos" aria-pressed="false">macOS</button>
          <button class="platform-choice" type="button" data-platform-choice="windows" aria-pressed="false">Windows</button>
        </div>
        <button class="icon-button" type="button" id="refreshPage" aria-label="刷新当前页面" title="刷新当前页面"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6 6.5L4 9m2 6a7 7 0 0 0 12 2.5L20 15"/></svg></button>
      </div>
    </div>
    <main class="workspace" id="workspace" tabindex="-1">
      <div class="page-card">
        <div class="frame-loading" id="frameLoading" role="status" aria-live="polite"><div class="loading-content"><span class="loading-spinner" aria-hidden="true"></span><span>正在加载页面…</span></div></div>
        <iframe id="taskFrame" src="./检验任务管理.html" title="检验任务管理主要内容"></iframe>
        <div class="closed-state" id="closedState"><div><div id="closedMessage">页面已关闭</div><button type="button" id="reopen">重新打开</button></div></div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const root = document.documentElement;
    const frame = document.querySelector('#taskFrame');
    const frameLoading = document.querySelector('#frameLoading');
    const closedState = document.querySelector('#closedState');
    const closedMessage = document.querySelector('#closedMessage');
    const crumbPath = document.querySelector('#crumbPath');
    const pageTitle = document.querySelector('#pageTitle');
    const platformChoices = document.querySelectorAll('[data-platform-choice]');
    const navItems = document.querySelectorAll('.nav-item');
    const toast = document.querySelector('#toast');
    let toastTimer;
    function initialPlatform() {
      const forced = new URLSearchParams(location.search).get('platform');
      if (forced === 'mac' || forced === 'macos') return 'macos';
      if (forced === 'win' || forced === 'windows') return 'windows';
      try {
        const saved = localStorage.getItem('cq-demo-platform');
        if (saved === 'macos' || saved === 'windows') return saved;
      } catch (error) {}
      return 'macos';
    }
    function applyPlatform(platform, persist = false) {
      root.dataset.platform = platform;
      platformChoices.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.platformChoice === platform));
      });
      if (persist) {
        try { localStorage.setItem('cq-demo-platform', platform); } catch (error) {}
        const url = new URL(location.href);
        url.searchParams.set('platform', platform);
        history.replaceState(null, '', url);
        notify(`已切换为 ${platform === 'macos' ? 'macOS' : 'Windows'} 演示布局`);
      }
    }
    function notify(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }
    function showPage(page, title, crumb) {
      crumbPath.textContent = crumb;
      pageTitle.textContent = title;
      document.title = `${title} · 容量计重离线系统`;
      if (page) {
        frameLoading.hidden = false;
        frame.src = './' + page;
        frame.hidden = false;
        closedState.classList.remove('show');
      } else {
        frame.hidden = true;
        closedMessage.textContent = `「${title}」功能正在开发中`;
        closedState.classList.add('show');
      }
    }
    function runWindowAction(action) {
      const desktopBridge = window.desktopAPI || window.electronAPI || window.__TAURI__?.window;
      const bridgeAction = desktopBridge?.[action] || desktopBridge?.[`${action}Window`];
      if (typeof bridgeAction === 'function') {
        bridgeAction.call(desktopBridge);
        return;
      }
      window.parent.postMessage({ type: 'window-control', action }, '*');
      const labels = { minimize: '最小化', maximize: '最大化 / 还原', close: '关闭' };
      notify(`已触发“${labels[action]}窗口”指令；桌面容器接入后将执行系统操作`);
    }
    applyPlatform(initialPlatform());
    platformChoices.forEach(button => {
      button.addEventListener('click', () => applyPlatform(button.dataset.platformChoice, true));
    });
    frame.addEventListener('load', () => { frameLoading.hidden = true; });
    if (frame.contentDocument?.readyState === 'complete') frameLoading.hidden = true;
    navItems.forEach(item => {
      item.addEventListener('click', event => {
        event.preventDefault();
        navItems.forEach(nav => { nav.classList.remove('active'); nav.removeAttribute('aria-current'); });
        item.classList.add('active');
        item.setAttribute('aria-current', 'page');
        showPage(item.dataset.page, item.dataset.title, item.dataset.crumb);
      });
    });
    document.querySelectorAll('[data-window-action]').forEach(button => {
      button.addEventListener('click', () => runWindowAction(button.dataset.windowAction));
    });
    document.querySelector('#refreshPage').addEventListener('click', () => {
      if (!frame.hidden) {
        frameLoading.hidden = false;
        frame.contentWindow.location.reload();
        notify('当前页面已刷新');
      }
    });
    window.addEventListener('message', event => {
      const data = event.data;
      if (!data) return;
      if (data.type === 'navigate') {
        if (data.crumb && data.title) {
          crumbPath.textContent = data.crumb;
          pageTitle.textContent = data.title;
          document.title = `${data.title} · 容量计重离线系统`;
        }
        frame.hidden = false;
        closedState.classList.remove('show');
      } else if (data.type === 'close-task-page') {
        const active = document.querySelector('.nav-item.active');
        if (active?.dataset.page) {
          showPage(active.dataset.page, active.dataset.title, active.dataset.crumb);
        } else {
          frame.hidden = true;
          closedMessage.textContent = '页面已关闭';
          closedState.classList.add('show');
        }
      }
    });
    document.querySelector('#reopen').addEventListener('click', () => {
      const active = document.querySelector('.nav-item.active');
      if (active?.dataset.page) showPage(active.dataset.page, active.dataset.title, active.dataset.crumb);
    });
  </script>
</body>
</html>
