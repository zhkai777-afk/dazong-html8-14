<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基础数据管理</title>
  <style>
    :root {
      --primary: #1e3a5f;
      --primary-hover: #162f4f;
      --text: #17243a;
      --text-secondary: #657387;
      --background: #f3f6fa;
      --surface: #fff;
      --surface-muted: #f7f9fb;
      --border: #d7e0eb;
      --border-strong: #b8c4d2;
      --focus: #2e78c7;
      --success: #075d49;
      --success-bg: #eaf7f2;
      font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-width: 320px; min-height: 100vh; margin: 0; font-size: 13px; line-height: 1.5; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .content { padding: 16px 20px 24px; }
    .card { border: 1px solid var(--border); border-radius: 5px; background: var(--surface); box-shadow: 0 1px 2px rgba(24, 47, 76, .04); }
    .intro { position: relative; padding: 18px 20px 20px; display: flex; align-items: center; justify-content: space-between; gap: 24px; overflow: hidden; }
    .intro h1 { margin: 0; font-size: 18px; }
    .intro p { max-width: 720px; margin: 4px 0 0; color: var(--text-secondary); font-size: 12px; }
    .offline-note { flex: none; padding: 5px 9px; border: 1px solid #a5cabb; border-radius: 4px; color: var(--success); background: var(--success-bg); font-size: 11px; font-weight: 650; }
    .intro-actions { display: flex; flex: none; align-items: center; gap: 10px; }
    .sync-meta { display: grid; gap: 4px; justify-items: end; color: var(--text-secondary); font-size: 11px; white-space: nowrap; }
    .sync-meta time { color: #334155; font-variant-numeric: tabular-nums; font-weight: 650; }
    .sync-button { min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--primary); border-radius: 4px; color: #fff; background: var(--primary); font-weight: 650; white-space: nowrap; transition: background 180ms ease, border-color 180ms ease, opacity 180ms ease; }
    .sync-button:hover { border-color: var(--primary-hover); background: var(--primary-hover); }
    .sync-button:disabled { cursor: wait; opacity: .72; }
    .sync-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sync-button.syncing svg { animation: spin 900ms linear infinite; }
    .push-button { min-height: 40px; padding: 0 14px; border: 1px solid #8da0b6; border-radius: 4px; color: var(--primary); background: #fff; font-weight: 650; white-space: nowrap; }
    .push-button:hover { border-color: var(--primary); background: #f4f7fb; }
    .push-button:disabled { cursor: wait; opacity: .7; }
    .sync-progress { position: absolute; right: 0; bottom: 0; left: 0; height: 3px; background: #dfe6ee; }
    .sync-progress-bar { width: 100%; height: 100%; background: #2e78c7; transform: scaleX(0); transform-origin: left center; transition: transform 220ms ease-out; }
    .sync-feedback { position: fixed; z-index: 50; top: 18px; left: 50%; padding: 9px 14px; border: 1px solid #8cc9b5; border-radius: 4px; color: var(--success); background: #fff; box-shadow: 0 8px 24px rgba(21,36,56,.16); opacity: 0; pointer-events: none; transform: translate(-50%, -12px); transition: opacity 180ms ease, transform 180ms ease; }
    .sync-feedback.show { opacity: 1; transform: translate(-50%, 0); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .workspace { min-height: 500px; margin-top: 12px; display: grid; grid-template-columns: 184px minmax(0, 1fr); overflow: hidden; }
    .tabs { display: flex; min-width: 0; padding: 12px 10px; gap: 4px; flex-direction: column; align-items: stretch; border-right: 1px solid var(--border); background: var(--surface-muted); }
    .tab { position: relative; width: 100%; min-height: 44px; padding: 0 14px 0 18px; border: 0; border-radius: 4px; color: #59687b; background: transparent; font-weight: 650; text-align: left; white-space: nowrap; transition: color 180ms ease, background 180ms ease; }
    .tab::after { position: absolute; top: 9px; bottom: 9px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: transparent; content: ""; }
    .tab:hover { color: var(--primary); background: #edf2f7; }
    .tab[aria-selected="true"] { color: var(--primary); background: var(--surface); }
    .tab[aria-selected="true"]::after { background: var(--primary); }
    .data-panel { min-width: 0; background: var(--surface); }
    .toolbar { min-height: 58px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--border); }
    .toolbar h2 { margin: 0; font-size: 16px; }
    .toolbar p { margin: 2px 0 0; color: var(--text-secondary); font-size: 11px; }
    .search { position: relative; width: min(320px, 38vw); }
    .search svg { position: absolute; top: 50%; left: 10px; width: 16px; height: 16px; fill: none; stroke: #7d8998; stroke-width: 1.8; transform: translateY(-50%); pointer-events: none; }
    .search input { width: 100%; min-height: 36px; padding: 0 12px 0 34px; border: 1px solid #cbd5e1; border-radius: 4px; color: var(--text); background: #fff; }
    .search input:hover { border-color: #8da0b6; }
    .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 58, 95, .12); outline: none; }
    .manage-button { min-height: 36px; padding: 0 12px; border: 1px solid var(--primary); border-radius: 4px; color: #fff; background: var(--primary); font-size: 12px; font-weight: 650; white-space: nowrap; }
    .manage-button:hover { background: var(--primary-hover); }
    .master-actions { display: flex; align-items: center; gap: 8px; }
    .row-input { width: 100%; min-height: 30px; padding: 0 6px; border: 1px solid transparent; border-radius: 3px; color: inherit; background: transparent; }
    .row-input:hover, .row-input:focus { border-color: var(--border-strong); background: #fff; outline: none; }
    .row-action { padding: 3px 7px; border: 1px solid #cbd5e1; border-radius: 3px; color: #41536a; background: #fff; font-size: 11px; }
    .row-action.danger { margin-left: 5px; border-color: #efb2b2; color: #a33737; }
    .table-scroll { min-height: 390px; overflow-x: auto; }
    table { width: 100%; min-width: 860px; border-collapse: separate; border-spacing: 0; }
    th, td { height: 42px; padding: 6px 12px; border-right: 1px solid #e5e9ef; border-bottom: 1px solid #e5e9ef; text-align: left; white-space: nowrap; }
    th:last-child, td:last-child { border-right: 0; }
    thead th { height: 38px; color: #293546; background: #f8f9fb; font-size: 11px; font-weight: 700; }
    tbody tr { transition: background 160ms ease, box-shadow 160ms ease; }
    tbody tr:hover { background: #f5f8fb; box-shadow: inset 3px 0 #7e9cbb; }
    tbody td { color: #4b5869; font-size: 12px; }
    tbody td:first-child { color: #2e536f; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 650; }
    .status { min-width: 50px; padding: 2px 7px; display: inline-flex; justify-content: center; border: 1px solid #8cc9b5; border-radius: 3px; color: var(--success); background: var(--success-bg); font-size: 10px; font-weight: 700; }
    .status.pending { border-color: #dcbf7a; color: #785500; background: #fff7e5; }
    .empty { min-height: 300px; padding: 48px 20px; display: none; place-items: center; color: #7a8797; text-align: center; }
    .empty.show { display: grid; }
    .empty svg { width: 48px; height: 48px; margin-bottom: 8px; fill: none; stroke: #aeb9c6; stroke-width: 1.6; }
    .empty strong { display: block; color: #536174; font-size: 14px; }
    .empty p { margin: 4px 0 0; font-size: 12px; }
    .modal-backdrop { position: fixed; z-index: 60; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(19, 35, 55, .42); }
    .modal { width: min(1160px, 100%); max-height: calc(100vh - 40px); overflow: auto; border: 1px solid var(--border); border-radius: 7px; background: #fff; box-shadow: 0 18px 50px rgba(16, 35, 58, .24); }
    .modal-header, .modal-footer { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .modal-header { border-bottom: 1px solid var(--border); }
    .modal-header h2 { margin: 0; font-size: 16px; }
    .modal-header p { margin: 3px 0 0; color: var(--text-secondary); font-size: 12px; }
    .modal-close { width: 30px; height: 30px; border: 0; border-radius: 4px; color: #526276; background: transparent; font-size: 21px; line-height: 1; }
    .modal-close:hover { background: #eef3f8; }
    .form-grid { padding: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px 16px; }
    .form-grid.ship-form { gap: 10px 28px; }
    .form-grid.ship-form::before { grid-column: 1 / -1; padding-bottom: 9px; border-bottom: 1px solid var(--border); color: var(--primary); content: "基本信息"; font-size: 14px; font-weight: 700; }
    .field { display: grid; gap: 5px; color: #43536a; font-size: 12px; font-weight: 650; }
    .field input, .field select { width: 100%; min-height: 34px; padding: 0 9px; border: 1px solid #cbd5e1; border-radius: 4px; color: var(--text); background: #fff; font-weight: 400; }
    .field input:focus, .field select:focus { border-color: var(--primary); outline: 0; box-shadow: 0 0 0 3px rgba(30,58,95,.12); }
    .field .required { color: #b42318; }
    .modal-footer { justify-content: flex-end; border-top: 1px solid var(--border); background: #fafbfd; }
    .button-secondary { min-height: 34px; padding: 0 13px; border: 1px solid #cbd5e1; border-radius: 4px; color: #42536a; background: #fff; font-weight: 650; }
    .form-error { margin-right: auto; color: #b42318; font-size: 12px; }
    @media (max-width: 700px) {
      .content { padding: 10px; }
      .intro { padding: 14px; align-items: flex-start; flex-direction: column; gap: 10px; }
      .intro-actions { width: 100%; align-items: stretch; flex-direction: column; gap: 8px; }
      .sync-meta { justify-items: start; }
      .sync-button { min-height: 44px; }
      .push-button { min-height: 44px; }
      .workspace { grid-template-columns: 122px minmax(0, 1fr); }
      .tabs { padding: 8px 6px; }
      .tab { min-width: 0; padding: 8px 8px 8px 13px; white-space: normal; }
      .toolbar { padding: 10px; align-items: flex-start; flex-direction: column; }
      .search { width: 100%; }
      .search input { min-height: 44px; font-size: 16px; }
      .table-scroll { min-height: 320px; padding: 10px; overflow: visible; }
      table { min-width: 0; display: block; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
      tbody { display: grid; gap: 10px; }
      tbody tr { padding: 12px; display: grid; grid-template-columns: 1fr; gap: 7px; border: 1px solid var(--border); border-radius: 4px; }
      tbody td { height: auto; padding: 0; border: 0; white-space: normal; }
      tbody td::before { display: block; margin-bottom: 1px; color: #7a8797; content: attr(data-label); font-size: 10px; font-weight: 400; }
      tbody td:last-child { justify-self: start; }
      .form-grid { grid-template-columns: 1fr; padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
      .sync-button.syncing svg { animation: none; }
    }
  </style>
</head>
<body>
  <main class="content">
    <section class="card intro" aria-labelledby="masterTitle">
      <div><h1 id="masterTitle">基础数据管理</h1><p>统一维护检验任务使用的客户、船舶、岸罐、港口码头及货物资料。任务建立后将保存所选数据的本地快照。</p></div>
      <div class="intro-actions">
        <div class="sync-meta"><span class="offline-note">本机数据</span><span>最近同步：<time id="lastSyncTime" datetime="2026-08-10T09:30">2026-08-10 09:30</time></span></div>
        <button class="sync-button" id="syncButton" type="button" aria-describedby="lastSyncTime">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-5V2"/><path d="M19 15a8 8 0 1 1-1.9-8.2L20 9"/></svg>
          <span id="syncButtonText">从主业务平台同步</span>
        </button>
        <button class="push-button" id="pushButton" type="button">同步至主业务平台</button>
      </div>
      <div class="sync-progress" id="syncProgress" role="progressbar" aria-label="基础数据同步进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div class="sync-progress-bar" id="syncProgressBar"></div></div>
    </section>

    <section class="card workspace" aria-label="基础数据列表">
      <div class="tabs" role="tablist" aria-label="基础数据类型" aria-orientation="vertical">
        <button class="tab" type="button" role="tab" aria-selected="true" data-key="clients">客户</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-key="vessels">船舶管理</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-key="tanks">岸罐</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-key="ports">港口码头</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-key="inspectionEquipmentTypes">检验设备类型</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-key="cargoTypes">货物类型</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-key="cargoes">货物</button>
      </div>

      <div class="data-panel">
        <div class="toolbar">
          <div><h2 id="listTitle">客户资料</h2><p id="listDescription">维护委托方名称、简称及业务联系人。</p></div>
          <label class="search">
            <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">搜索当前基础数据</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
            <input id="searchInput" type="search" placeholder="搜索名称、编号或关键字">
          </label>
          <div class="master-actions"><button class="manage-button" id="addMasterItemButton" type="button" hidden>新增</button><button class="button-secondary" id="downloadVesselTemplate" type="button" hidden>下载模板</button><button class="button-secondary" id="importVesselButton" type="button" hidden>导入</button><input id="importVesselFile" type="file" accept=".csv,text/csv" hidden></div>
        </div>

        <div class="table-scroll" id="tableWrap">
          <table>
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyState">
          <div><svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="16" rx="22" ry="8"/><path d="M10 16v17c0 4.4 9.8 8 22 8s22-3.6 22-8V16M10 33v15c0 4.4 9.8 8 22 8s22-3.6 22-8V33"/></svg><strong>没有找到匹配数据</strong><p>请调整搜索关键字后重试。</p></div>
        </div>
      </div>
    </section>
  </main>
  <div class="sync-feedback" id="syncFeedback" role="status" aria-live="polite">同步完成，基础数据已更新。</div>
  <div class="modal-backdrop" id="masterModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <form id="masterForm">
        <header class="modal-header"><div><h2 id="modalTitle">新增基础数据</h2><p id="modalDescription">保存后将作为本机待同步数据。</p></div><button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button></header>
        <div class="form-grid" id="formFields"></div>
        <footer class="modal-footer"><span class="form-error" id="formError" role="alert"></span><button class="button-secondary" id="modalCancel" type="button">取消</button><button class="manage-button" type="submit">保存为本机数据</button></footer>
      </form>
    </section>
  </div>

  <script>
    const sources = {
      clients: {
        title: '客户资料', description: '维护委托方名称、简称及业务联系人。',
        columns: ['客户编号', '客户名称', '英文名称', '联系人', '状态', '更新时间'],
        rows: [
          ['CUS-001', '中国石油国际事业有限公司', 'PETROCHINA INTERNATIONAL CO., LTD.', '张经理', '有效', '2026-07-18'],
          ['CUS-002', '中国联合石油有限责任公司', 'CHINA NATIONAL UNITED OIL CORPORATION', '李经理', '有效', '2026-06-26'],
          ['CUS-003', '中国石化燃料油销售有限公司', 'SINOPEC FUEL OIL SALES CO., LTD.', '王经理', '有效', '2026-05-09']
        ]
      },
      vessels: { title: '船舶管理', description: '维护船舶基本信息、计量参数及联系人；保存后临时任务单将自动读取最新船舶数据。', columns: [] },
      tanks: {
        title: '岸罐资料', description: '维护检定证书、罐体参数及罐容表关联；可手动新增后同步至主业务平台。',
        columns: ['设备编号', '器具名称', '申检单位', '标称容积', '有效日期', '同步状态'],
        rows: [
          ['G101', '立式金属浮顶罐', '中国石化集团商业储备有限公司宁波分公司', '109,055.087 m³', '2028-08-19', '已同步'],
          ['TK-A02', '立式金属浮顶罐', '仙人岛原油码头', '100,000 m³', '2028-05-18', '已同步'],
          ['TK-D08', '储油罐', '董家口原油码头', '80,000 m³', '2027-10-31', '已同步']
        ]
      },
      ports: {
        title: '港口码头资料', description: '维护检验地点、港口及码头名称。',
        columns: ['地点编号', '港口名称', '码头名称', '国家/地区', '状态', '更新时间'],
        rows: [
          ['LOC-001', '营口港', '仙人岛原油码头', '中国', '有效', '2026-07-03'],
          ['LOC-002', '青岛港', '董家口原油码头', '中国', '有效', '2026-06-12'],
          ['LOC-003', '大连港', '新港油库', '中国', '有效', '2026-05-28']
        ]
      },
      cargoes: {
        title: '货物资料', description: '维护货物中英文名称及货物分类。',
        columns: ['货物编号', '货物名称', '英文名称', '分类', '状态', '更新时间'],
        rows: [
          ['CRG-001', '阿曼出口混合原油', 'OMAN EXPORT BLEND CRUDE OIL', '原油', '有效', '2026-07-16'],
          ['CRG-002', '上扎库姆原油', 'UPPER ZAKUM CRUDE OIL', '原油', '有效', '2026-06-08'],
          ['CRG-003', '0# 车用柴油', 'NO. 0 AUTOMOTIVE DIESEL', '成品油', '有效', '2026-05-15']
        ]
      }
    };

    const cargoMasterKey = 'offlineSurveyCargoMaster';
    const defaultCargoMaster = {
      LIQUID_CHEMICALS: { label: '液体化学品', subtypes: {
        CHEMICALS: { label: '化学品', cargos: [{ name: '化学品（TEC）', nameEn: 'CHEMICALS (TEC)', category: 'C · 液体化学品', calculationMethod: 'TEC' }, { name: '化学品（DCF）', nameEn: 'CHEMICALS (DCF)', category: 'C · 液体化学品', calculationMethod: 'DCF' }] },
        AROMATICS_CYCLOHEXANE: { label: '芳香烃及环己烷', cargos: [{ name: '芳香烃及环己烷', nameEn: 'AROMATICS AND CYCLOHEXANE', category: 'C · 液体化学品', calculationMethod: 'ASTM_D1555' }] }
      } },
      CLEAN_OIL: { label: '清洁油', subtypes: {
        NAPHTHA_GASOLINE_JET: { label: '石脑油 / 汽油 / 喷气燃料', cargos: [{ name: '石脑油 / 汽油 / 喷气燃料', nameEn: 'NAPHTHA / GASOLINE / JET FUEL', category: 'B · 成品油', calculationMethod: 'API_TABLE', calculationCategory: 'B' }] },
        DIESEL: { label: '柴油', cargos: [{ name: '柴油', nameEn: 'DIESEL', category: 'B · 成品油', calculationMethod: 'API_TABLE', calculationCategory: 'B' }] },
        LUBRICANT: { label: '润滑油', cargos: [{ name: '润滑油', nameEn: 'LUBRICATING OIL', category: 'D · 润滑油', calculationMethod: 'API_TABLE', calculationCategory: 'D' }] },
        CRUDE_CONDENSATE: { label: '原油 / 凝析油', cargos: [{ name: '原油 / 凝析油', nameEn: 'CRUDE OIL / CONDENSATE', category: 'A · 原油', calculationMethod: 'API_TABLE', calculationCategory: 'A' }, { name: '阿曼出口混合原油', nameEn: 'OMAN EXPORT BLEND CRUDE OIL', category: 'A · 原油', calculationMethod: 'API_TABLE', calculationCategory: 'A' }, { name: '上扎库姆原油', nameEn: 'UPPER ZAKUM CRUDE OIL', category: 'A · 原油', calculationMethod: 'API_TABLE', calculationCategory: 'A' }] }
      } },
      SLOP_OIL: { label: '污油', subtypes: {
        FUEL_OIL: { label: '燃料油', cargos: [{ name: '燃料油', nameEn: 'FUEL OIL', category: 'B · 成品油', calculationMethod: 'API_TABLE', calculationCategory: 'B' }] },
        ASPHALT_TAR: { label: '沥青 / 柏油', cargos: [{ name: '沥青 / 柏油', nameEn: 'ASPHALT / TAR', category: 'D · 重油', calculationMethod: 'ASTM_D4311' }] }
      } }
    };
    let cargoMaster;
    try {
      const stored = JSON.parse(localStorage.getItem(cargoMasterKey));
      cargoMaster = stored && typeof stored === 'object' && Object.keys(stored).length ? stored : defaultCargoMaster;
    } catch (error) { cargoMaster = defaultCargoMaster; }

    importVesselButton.addEventListener('click', () => importVesselFile.click());
    importVesselFile.addEventListener('change', () => {
      const file = importVesselFile.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const lines = String(reader.result || '').replace(/^\ufeff/, '').split(/\r?\n/).filter(Boolean);
        const headers = (lines.shift() || '').split(',').map(value => value.trim());
        const fieldMap = { 船舶名称: 'vesselName', 船舶英文名称: 'vesselNameEn', 曾用名: 'formerName', IMO号: 'imoNo', MMSI号: 'mmsiNo', 船舶种类: 'vesselType', 船舶所有人: 'owner', 船舶经营人: 'operator', 船舶联系电话: 'contactPhone' };
        let imported = 0;
        lines.forEach(line => {
          const values = line.split(',').map(value => value.trim());
          const item = Object.fromEntries(headers.map((header, index) => [fieldMap[header], values[index] || '']).filter(([key]) => key));
          if (!item.vesselName || !item.imoNo || vesselMaster.some(vessel => vessel.vesselName === item.vesselName && vessel.imoNo === item.imoNo)) return;
          vesselMaster.push({ ...item, createdAt: new Date().toISOString() }); imported += 1;
        });
        persistVesselMaster(); render(); showFeedback(imported ? `已导入 ${imported} 条船舶数据，临时任务单将同步更新。` : '未导入数据：请检查模板内容或重复记录。');
      };
      reader.readAsText(file, 'UTF-8'); importVesselFile.value = '';
    });
    masterForm.addEventListener('submit', event => {
      event.preventDefault();
      const key = masterForm.dataset.key;
      const data = Object.fromEntries(new FormData(masterForm).entries());
      if (key === 'vessels') {
        const editingIndex = masterForm.dataset.editingIndex === '' ? null : Number(masterForm.dataset.editingIndex);
        const duplicate = vesselMaster.some((item, index) => index !== editingIndex && item.imoNo === data.imoNo && item.vesselName === data.vesselName);
        if (duplicate) { formError.textContent = '相同 IMO 号和船舶名称的记录已存在。'; return; }
        if (editingIndex === null) vesselMaster.push({ ...data, createdAt: new Date().toISOString() });
        else vesselMaster[editingIndex] = { ...vesselMaster[editingIndex], ...data, updatedAt: new Date().toISOString() };
        persistVesselMaster();
        closeEquipmentModal();
        render();
        showFeedback(editingIndex === null ? '船舶已保存，临时任务单将读取最新船舶数据。' : '船舶信息已更新，临时任务单将读取最新船舶数据。');
        return;
      }
      const identity = key === 'tanks' ? data.equipmentNo : `${data.imoNo}-${data.tankNo}`;
      const duplicate = equipmentMaster[key].some(item => (key === 'tanks' ? item.equipmentNo : `${item.imoNo}-${item.tankNo}`) === identity);
      if (duplicate) { formError.textContent = '该基础数据已在本机待同步列表中。'; return; }
      equipmentMaster[key].push({ ...data, createdAt: new Date().toISOString() });
      persistEquipmentMaster();
      closeEquipmentModal();
      render();
      showFeedback(`${key === 'tanks' ? '岸罐' : '船舱'}已保存为本机数据，等待同步至主业务平台。`);
    });
    tableBody.addEventListener('change', event => {
      const equipmentTypeInput = event.target.closest('[data-equipment-type]');
      if (equipmentTypeInput) {
        const previous = equipmentTypeInput.dataset.equipmentType;
        const next = equipmentTypeInput.value.trim();
        if (!next || (next !== previous && inspectionEquipmentTypes.includes(next))) {
          equipmentTypeInput.value = previous;
          return showFeedback(!next ? '设备类型不能为空。' : '该检验设备类型已存在。');
        }
        inspectionEquipmentTypes = inspectionEquipmentTypes.map(type => type === previous ? next : type);
        persistInspectionEquipmentTypes();
        render();
        return;
      }
      const input = event.target.closest('[data-master-field]');
      if (!input) return;
      const type = cargoMaster[input.dataset.type];
      if (!type) return;
      const subtype = type.subtypes[input.dataset.subtype];
      if (input.dataset.masterField === 'typeLabel') type.label = input.value.trim() || type.label;
      else if (input.dataset.masterField === 'subtypeLabel' && subtype) subtype.label = input.value.trim() || subtype.label;
      else if (subtype) {
        const cargo = subtype.cargos[Number(input.dataset.index)];
        if (!cargo) return;
        const fields = { cargoName: 'name', cargoNameEn: 'nameEn', cargoCategory: 'category', calculationMethod: 'calculationMethod' };
        cargo[fields[input.dataset.masterField]] = input.value.trim();
      }
      persistCargoMaster();
    });
    tableBody.addEventListener('click', event => {
      const editVesselButton = event.target.closest('[data-edit-vessel]');
      if (editVesselButton) { openEquipmentModal('vessels', Number(editVesselButton.dataset.editVessel)); return; }
      const deleteVesselButton = event.target.closest('[data-delete-vessel]');
      if (deleteVesselButton) {
        const index = Number(deleteVesselButton.dataset.deleteVessel);
        const vessel = vesselMaster[index];
        if (!vessel || !window.confirm(`确认删除船舶“${vessel.vesselName}”吗？`)) return;
        vesselMaster.splice(index, 1);
        persistVesselMaster();
        render();
        showFeedback('船舶已删除，临时任务单的可选船舶已同步更新。');
        return;
      }
      const equipmentTypeButton = event.target.closest('[data-delete-equipment-type]');
      if (equipmentTypeButton) {
        const name = equipmentTypeButton.dataset.deleteEquipmentType;
        if (!window.confirm(`确认删除检验设备类型“${name}”吗？`)) return;
        inspectionEquipmentTypes = inspectionEquipmentTypes.filter(type => type !== name);
        persistInspectionEquipmentTypes();
        render();
        return;
      }
      const button = event.target.closest('[data-delete-subtype], [data-delete-cargo]');
      if (!button || !window.confirm('确认删除该基础数据吗？')) return;
      const type = cargoMaster[button.dataset.type];
      const subtype = type?.subtypes[button.dataset.subtype];
      if (!subtype) return;
      if (button.hasAttribute('data-delete-subtype')) delete type.subtypes[button.dataset.subtype];
      else subtype.cargos.splice(Number(button.dataset.index), 1);
      if (!Object.keys(type.subtypes).length) delete cargoMaster[button.dataset.type];
      persistCargoMaster();
      render();
    });
    tabs.forEach((tab, index) => tab.addEventListener('keydown', event => {
      if (!['ArrowUp', 'ArrowDown'].includes(event.key)) return;
      event.preventDefault();
      const nextIndex = event.key === 'ArrowDown' ? (index + 1) % tabs.length : (index - 1 + tabs.length) % tabs.length;
      tabs[nextIndex].focus();
      tabs[nextIndex].click();
    }));
    syncButton.addEventListener('click', () => {
      if (syncButton.disabled) return;
      const stages = [18, 42, 68, 88, 100];
      let stageIndex = 0;
      syncButton.disabled = true;
      syncButton.classList.add('syncing');
      syncButton.setAttribute('aria-busy', 'true');
      syncProgress.hidden = false;
      syncProgress.setAttribute('aria-valuenow', '0');
      syncProgressBar.style.transform = 'scaleX(0)';
      syncButtonText.textContent = '正在连接主业务平台';

      const syncTimer = window.setInterval(() => {
        const progress = stages[stageIndex];
        syncProgress.setAttribute('aria-valuenow', String(progress));
        syncProgressBar.style.transform = `scaleX(${progress / 100})`;
        syncButtonText.textContent = progress < 100 ? `正在同步 ${progress}%` : '同步完成';
        stageIndex += 1;
        if (progress < 100) return;

        window.clearInterval(syncTimer);
        const completedAt = new Date();
        const completedText = formatDateTime(completedAt);
        lastSyncTime.textContent = completedText;
        lastSyncTime.dateTime = completedText.replace(' ', 'T');
        render();
        try { localStorage.setItem('masterDataLastSync', completedText); } catch (error) {}
        showFeedback(`同步完成：已从主业务平台更新基础数据 · ${completedText}`);

        window.setTimeout(() => {
          syncButton.disabled = false;
          syncButton.classList.remove('syncing');
          syncButton.removeAttribute('aria-busy');
          syncButtonText.textContent = '从主业务平台同步';
          syncProgress.hidden = true;
        }, 700);
      }, 260);
    });
    pushButton.addEventListener('click', () => {
      const pendingTanks = equipmentMaster.tanks.filter(item => item.syncStatus !== '已同步').length;
      const pendingVessels = equipmentMaster.vessels.filter(item => item.syncStatus !== '已同步').length;
      const total = pendingTanks + pendingVessels;
      if (!total) { showFeedback('没有待同步的岸罐或船舱本机数据。'); return; }
      pushButton.disabled = true;
      pushButton.textContent = '正在提交…';
      window.setTimeout(() => {
        equipmentMaster.tanks.forEach(item => { if (item.syncStatus !== '已同步') item.syncStatus = '已同步'; });
        equipmentMaster.vessels.forEach(item => { if (item.syncStatus !== '已同步') item.syncStatus = '已同步'; });
        persistEquipmentMaster();
        render();
        pushButton.disabled = false;
        pushButton.textContent = '同步至主业务平台';
        showFeedback(`已同步至主业务平台：${pendingTanks} 条岸罐、${pendingVessels} 条船舱资料。`);
      }, 650);
    });
    searchInput.addEventListener('input', render);
    render();
  </script>
</body>
</html>
